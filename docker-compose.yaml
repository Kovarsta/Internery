services:
  db:
    image: postgres
    restart: unless-stopped
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: internery
      POSTGRES_PASSWORD: internery
      POSTGRES_DB: internery
    volumes:
      - internery:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U internery -d internery']
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO stopped publishing community images to Docker Hub and Quay in 2025.
  # Chainguard maintains a public build of the same server. Pin the digest for
  # reproducible staging deploys.
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio-staging
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-please}
      # Alias used by the healthcheck below. URL-encode special characters in
      # the password, or use a password that is safe in a URL.
      MC_HOST_local: http://${MINIO_ROOT_USER:-admin}:${MINIO_ROOT_PASSWORD:-change-me-please}@localhost:9000
      # Public console URL behind a reverse proxy. Leave as localhost for local
      # development, or set it in .env for staging.
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://localhost:9001}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Web console
    healthcheck:
      # `mc` ships in the Chainguard image. `curl` does not.
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Creates the staging bucket once, then exits. Safe to re-run.
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:-admin}:${MINIO_ROOT_PASSWORD:-change-me-please}@minio:9000
    entrypoint: ['/usr/bin/mc']
    command: ['mb', '--ignore-existing', 'local/${S3_BUCKET:-internery-staging}']
    restart: 'no'

  # Uploads the shared blank avatar once, then exits. Reset points at this key,
  # so it has to exist before any reset can be served. Safe to re-run.
  minio-blank-avatar:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:-admin}:${MINIO_ROOT_PASSWORD:-change-me-please}@minio:9000
    volumes:
      - ./docker/minio/blank-avatar.png:/tmp/blank-avatar.png:ro
    entrypoint: ['/usr/bin/mc']
    command:
      [
        'cp',
        '--quiet',
        '/tmp/blank-avatar.png',
        'local/${S3_BUCKET:-internery-staging}/avatars/_blank.png'
      ]
    restart: 'no'

  # Production-style app container for a teammate demo. It is behind the
  # `demo` profile, so `pnpm db:start` (plain `docker compose up`) still starts
  # only the database and MinIO for local development.
  #
  #   docker compose --profile demo up -d --build app
  #
  # The database must already be migrated and seeded:
  #
  #   pnpm db:migrate
  #   pnpm db:seed
  #
  # `APP_ORIGIN` must match the address the demo is opened at, because Better
  # Auth uses it for cookies and OAuth callbacks, and SvelteKit trusts it for
  # form submissions. Changing it requires a rebuild:
  #
  #   APP_ORIGIN=https://demo.example.com docker compose --profile demo up -d --build app
  app:
    profiles: ['demo']
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio-blank-avatar:
        condition: service_completed_successfully
    ports:
      - '${APP_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      # Adapter-node allows 512 KB per request by default. CVs and verification
      # licences are accepted up to 5 MB, so leave room for multipart overhead.
      BODY_SIZE_LIMIT: 10M
      ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgres://internery:internery@db:5432/internery
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-internery-staging}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-admin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-change-me-please}
      BETTER_AUTH_SECRET: '${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}'
      WORK_RECORD_SECRET: '${WORK_RECORD_SECRET:?Set WORK_RECORD_SECRET in .env}'
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM_ADDRESS: '${EMAIL_FROM_ADDRESS:-Internery <no-reply@example.com>}'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  internery:
  minio-data:
